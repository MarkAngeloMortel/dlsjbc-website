    <link rel="stylesheet" crossorigin href="style.css">
  </head>
  <body>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("dlsjbc-theme");
          var isDark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
  </body>
